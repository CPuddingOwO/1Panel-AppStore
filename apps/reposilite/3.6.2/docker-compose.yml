networks:
  1panel-network:
    external: true

services:
  reposilite:
    container_name: ${CONTAINER_NAME}
    image: dzikoysk/reposilite:3.6.2
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx128M}
      - REPOSILITE_OPTS=${REPOSILITE_OPTS:-}
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    labels:
      createdBy: "Apps"